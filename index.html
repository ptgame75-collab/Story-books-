<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>अधिराज-Khat</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; overflow: hidden;
            font-family: 'Georgia', serif;
        }

        /* ब्याकग्राउन्ड फोटो सेटअप */
        #bgPhoto {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('a.0063.jpg') no-repeat center center;
            background-size: cover;
            filter: brightness(0.4) blur(2px); /* फोटोलाई अलि डार्क र मधुरो बनाइएको */
            opacity: 0;
            animation: fadeInBg 2s forwards;
        }

        @keyframes fadeInBg {
            to { opacity: 1; }
        }

        /* टाइपिङ एनिमेसन कन्टेनर */
        #introContainer {
            position: relative; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 10; padding: 20px; text-align: center;
        }

        .typing-text {
            color: #fff; font-size: 24px; font-weight: bold;
            letter-spacing: 2px; min-height: 1.5em;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* लोडिङ बार */
        .progress-bar {
            width: 70%; max-width: 250px; height: 3px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px; margin-top: 30px; overflow: hidden;
        }

        .progress-fill {
            width: 0%; height: 100%; background: #d32f2f;
            transition: 3.5s linear;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="bgPhoto"></div>

    <div id="introContainer">
        <div id="typewriter" class="typing-text"></div>
        <div class="progress-bar">
            <div id="pFill" class="progress-fill"></div>
        </div>
    </div>

    <script>
        const text = "अधुरा शब्दहरूको दस्ताबेज";
        const typewriterElement = document.getElementById('typewriter');
        const fill = document.getElementById('pFill');
        let index = 0;

        // टाइपिङ फङ्गसन
        function typeWriter() {
            if (index < text.length) {
                typewriterElement.innerHTML += text.charAt(index);
                index++;
                setTimeout(typeWriter, 120); // टाइपिङ गति (१२०ms)
            }
        }

        // सबै कुरा लोड भएपछि सुरु गर्ने
        window.onload = () => {
            // टाइपिङ र लोडिङ बार सँगै सुरु गर्ने
            setTimeout(() => {
                typeWriter();
                fill.style.width = '100%';
            }, 500);

            // ४ सेकेन्ड पछि मुख्य पेज (home.html) मा लैजाने
            setTimeout(() => {
                document.body.style.transition = '1s';
                document.body.style.opacity = '0';
                setTimeout(() => {
                    window.location.href = "home.html";
                }, 1000);
            }, 4500);
        };
    </script>
</body>
</html>
