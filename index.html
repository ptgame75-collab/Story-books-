<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लोडिङ...</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100vh; }
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .loader-text { color: #fff; font-family: serif; font-size: 18px; margin-bottom: 15px; z-index: 10; text-shadow: 0 2px 4px #000; }
        .progress-bar { width: 80%; max-width: 300px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 10px; overflow: hidden; z-index: 10; margin-bottom: 60px; }
        .progress-fill { width: 0%; height: 100%; background: #d32f2f; }
    </style>
</head>
<body>
    <video id="v" muted playsinline autoplay>
        <source src="intro.mp4" type="video/mp4">
    </video>
    <div class="loader-text">मनको भावना दस्ताबेज</div>
    <div class="progress-bar"><div id="f" class="progress-fill"></div></div>

    <script>
        const v = document.getElementById('v');
        const f = document.getElementById('f');
        
        // भिडियो चल्न सुरु भएपछि मात्र बार बढाउने
        v.onplay = () => {
            f.style.transition = '1.9s linear'; // १.९ सेकेन्डको भिडियो
            f.style.width = '100%';
            setTimeout(() => {
                window.location.href = "home.html"; // भिडियो सकिएपछि home.html मा लैजाने
            }, 2200); 
        };

        // यदि भिडियो लोड हुन मानेन भने पनि ५ सेकेन्डमा आफै भित्र छिर्ने
        setTimeout(() => {
            window.location.href = "home.html";
        }, 5000);
    </script>
</body>
</html>
