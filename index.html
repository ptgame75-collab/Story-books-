<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>अधिराज - मनको भावना</title>
    <style>
        /* लोडिङ स्क्रिन */
        #loadingScreen { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; 
        }
        .loader-text { color: #fff; font-family: serif; font-size: 20px; margin-bottom: 20px; }
        .progress-bar { width: 200px; height: 3px; background: #333; }
        .progress-fill { width: 0%; height: 100%; background: #d32f2f; animation: fillBar 2s forwards; }
        @keyframes fillBar { 100% { width: 100%; } }

        body { background: #fcfbf7; font-family: 'Georgia', serif; margin: 0; display: flex; flex-direction: column; align-items: center; opacity: 0; transition: 1s; -webkit-user-select: none; user-select: none; }
        body.visible { opacity: 1; }
        .header { margin-top: 50px; text-align: center; }
        .header h1 { color: #4a3728; font-size: 24px; }

        .main-content { width: 90%; max-width: 400px; margin-top: 40px; display: flex; flex-direction: column; gap: 20px; }
        .diary-card { background: white; padding: 30px 20px; border-radius: 15px; text-decoration: none; display: block; border-left: 6px solid #d32f2f; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; }
        .diary-card h2 { color: #2c3e50; font-size: 19px; margin: 0; }
        .diary-card p { color: #d32f2f; font-size: 13px; margin-top: 10px; font-weight: bold; }
        .footer { margin-top: auto; padding: 30px; color: #999; font-size: 12px; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="loadingScreen">
        <div class="loader-text">मनको भावना दस्ताबेज</div>
        <div class="progress-bar"><div class="progress-fill"></div></div>
    </div>

    <div class="header"><h1>मनको भावना</h1></div>

    <div class="main-content">
        <a href="message.html#anusthan" class="diary-card">
            <h2>169 अनुष्ठान</h2>
            <p>पढ्नको लागि ट्याप गर्नुहोस्</p>
        </a>

        <a href="message.html#adhura" class="diary-card">
            <h2>मेरा अधुरा शब्दहरू</h2>
            <p>पढ्नको लागि ट्याप गर्नुहोस्</p>
        </a>

        <a href="message.html#shayari" class="diary-card">
            <h2>तिम्रा लागि "सायरीहरू"</h2>
            <p>क्रमशः आउँदैछ...</p>
        </a>
    </div>

    <div class="footer">2026 अधिराज | सुजना श्रेष्ठको लागि</div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loadingScreen').style.display = 'none';
                document.body.classList.add('visible');
            }, 2000);
        });
    </script>
</body>
</html>
