<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>अधिराजको खत</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- iOS support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="अधिराजको खत">
    <link rel="apple-touch-icon" href="a.0063.jpg">

    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Georgia', serif; }
        
        #bgPhoto { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: url('a.0063.jpg') no-repeat center center; 
            background-size: cover; 
            filter: brightness(0.4) blur(2px); 
            opacity: 0; 
            animation: fadeInBg 2s forwards; 
        }

        @keyframes fadeInBg { to { opacity: 1; } }

        #introContainer { 
            position: fixed; 
            top: 0;
            left: 0;
            width: 100%;
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            z-index: 10000; 
            padding: 20px; 
            text-align: center; 
            background: #000;
            transition: opacity 1s ease;
        }

        .typing-text { 
            color: #fff; 
            font-size: 24px; 
            font-weight: bold; 
            letter-spacing: 2px; 
            min-height: 1.5em; 
            text-shadow: 0 4px 10px rgba(0,0,0,0.5); 
            display: inline-block;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 24px;
            background-color: #d32f2f;
            margin-left: 4px;
            vertical-align: middle;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .progress-bar { 
            width: 70%; 
            max-width: 250px; 
            height: 3px; 
            background: rgba(255,255,255,0.2); 
            border-radius: 10px; 
            margin-top: 30px; 
            overflow: hidden; 
        }

        .progress-fill { 
            width: 0%; 
            height: 100%; 
            background: #d32f2f; 
            transition: width 3.5s linear; 
        }

        /* निरन्तर बजिरहने एप फ्रेम */
        #appFrame {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            display: none;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- लगातार ब्याकग्राउन्डमा बज्ने म्युजिक -->
    <audio id="global-audio" loop preload="auto">
        <source src="dasai.mp3" type="audio/mpeg">
    </audio>

    <!-- इन्ट्रो स्क्रिन -->
    <div id="introContainer">
        <div id="bgPhoto"></div>
        <div style="position: relative; z-index: 20;">
            <span id="typewriter" class="typing-text"></span><span id="cursor" class="cursor"></span>
        </div>
        <div class="progress-bar" style="position: relative; z-index: 20;">
            <div id="pFill" class="progress-fill"></div>
        </div>
    </div>

    <!-- मुख्य एप चल्ने फ्रेम -->
    <iframe src="home.html" id="appFrame"></iframe>

    <script>
        const audio = document.getElementById("global-audio");
        audio.volume = 0.5;
        let isAudioPlaying = false;

        // अडियो सुरक्षित तरिकाले प्ले गराउने
        function playAudio() {
            audio.play().then(() => {
                isAudioPlaying = true;
            }).catch(err => console.log("User interaction required"));
        }

        // अडियो रोक्ने
        function stopAudio() {
            audio.pause();
        }

        // स्क्रिन क्लिक/टच गर्दा बजाउने
        function handleUserInteraction() {
            playAudio();
            document.removeEventListener("click", handleUserInteraction);
            document.removeEventListener("touchstart", handleUserInteraction);
        }

        document.addEventListener("click", handleUserInteraction);
        document.addEventListener("touchstart", handleUserInteraction);

        // iframe भित्रका टच/क्लिक ट्रयाक गर्ने
        const frame = document.getElementById('appFrame');
        frame.addEventListener('load', () => {
            try {
                const iframeDoc = frame.contentWindow.document;
                iframeDoc.addEventListener('click', handleUserInteraction);
                iframeDoc.addEventListener('touchstart', handleUserInteraction);
            } catch (e) {}
        });

        // १. एप/ट्याब बन्द हुँदा वा ब्याकग्राउन्डमा जाँदा (Minimize/Close/Switch) अडियो १००% रोक्ने
        function onAppHide() {
            stopAudio();
        }

        // २. एप पुनः अगाडि आउँदा (Open/Focus) अडियो सुरु गर्ने
        function onAppShow() {
            if (isAudioPlaying) {
                playAudio();
            }
        }

        // मोबाइल र ब्राउजरका सबै लाइफसाइकल इभेन्टहरू ह्यान्डल गर्ने
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                onAppHide();
            } else {
                onAppShow();
            }
        });

        window.addEventListener("pagehide", onAppHide);
        window.addEventListener("blur", onAppHide);
        window.addEventListener("pageshow", onAppShow);
        window.addEventListener("focus", onAppShow);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.getRegistrations().then(regs => {
                    let unregisterPromises = regs.map(reg => reg.unregister());
                    return Promise.all(unregisterPromises);
                }).then(() => {
                    return navigator.serviceWorker.register('sw.js');
                }).then(() => console.log('SW Registered'))
                .catch(err => console.log('SW Registration error:', err));
            });
        }

        const text = "अधुरा शब्दहरूको दस्ताबेज";
        const typewriterElement = document.getElementById('typewriter');
        const cursorElement = document.getElementById('cursor');
        const fill = document.getElementById('pFill');
        let index = 0;

        function typeWriter() {
            if (index < text.length) {
                typewriterElement.innerHTML += text.charAt(index);
                index++;
                setTimeout(typeWriter, 120);
            } else {
                cursorElement.style.display = 'none';
            }
        }

        window.onload = () => {
            const intro = document.getElementById('introContainer');

            if (sessionStorage.getItem('appLoaded')) {
                intro.style.display = 'none';
                frame.style.display = 'block';
                return;
            }
            sessionStorage.setItem('appLoaded', 'true');

            setTimeout(() => {
                typeWriter();
                fill.style.width = '100%';
            }, 500);

            setTimeout(() => {
                intro.style.opacity = '0';
                frame.style.display = 'block';
                setTimeout(() => {
                    intro.style.display = 'none';
                }, 1000);
            }, 4500);
        };
    </script>
</body>
</html>
