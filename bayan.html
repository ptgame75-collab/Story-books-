<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अधिराजको डायरी</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; background: #fcfbf7; }
        .container { max-width: 600px; margin: auto; }
        .photo-frame { width: 150px; height: 150px; border-radius: 50%; display: block; margin: 20px auto; border: 3px solid #5D4037; }
        .p-item { padding: 10px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .highlight { background-color: #fff176 !important; }
        .fixed-menu { position: fixed; bottom: 20px; right: 20px; display: none; gap: 10px; }
        button { padding: 10px 20px; border-radius: 20px; border: none; cursor: pointer; background: #5D4037; color: white; }
    </style>
</head>
<body>

<div class="container">
    <img src="dolly.png" alt="डल्ली" class="photo-frame">
    <div id="content">
        <p class="p-item">हेलो, मलाई थाहा छैन म कहाँबाट सुरु गरम...</p>
        <p class="p-item">जब म तिम्रो अनुहारलाई नियालेर हेर्छु, म अवाक बन्छु...</p>
        <p class="p-item">तिमी हाँस्दा यस्तो महसुस हुन्छ, मानौँ यो सारा ब्रह्माण्ड...</p>
    </div>
</div>

<div class="fixed-menu" id="menu">
    <button onclick="clearAll()">🗑️ क्लियर</button>
    <button onclick="save()">💾 सेभ</button>
</div>

<script>
    let selected = null;
    document.querySelectorAll('.p-item').forEach(p => {
        p.oncontextmenu = (e) => e.preventDefault(); // राइट क्लिक रोक्न
        p.addEventListener('mousedown', () => {
            selected = p;
            document.querySelectorAll('.p-item').forEach(el => el.classList.remove('highlight'));
            p.classList.add('highlight');
            document.getElementById('menu').style.display = 'flex';
        });
    });

    function save() {
        if(selected) {
            localStorage.setItem('saved_id', selected.innerText.substring(0, 20));
            alert("सेभ भयो!");
        }
    }
    
    function clearAll() {
        localStorage.clear();
        document.querySelectorAll('.p-item').forEach(el => el.classList.remove('highlight'));
        document.getElementById('menu').style.display = 'none';
    }
</script>
</body>
</html>
