<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरो फोटो एल्बम</title>
    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            padding: 10px;
        }
        .gallery img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h2 style="text-align: center;">मेरो फोटोहरू</h2>

    <div class="gallery">
        <img src="1.jpg" alt="Photo 1">
        <img src="2.jpg" alt="Photo 2">

        <img src="4.jpg" alt="Photo 4">
        <img src="5.jpg" alt="Photo 5">
        <img src="6.jpg" alt="Photo 6">
        <img src="7.jpg" alt="Photo 7">

        <img src="9.jpg" alt="Photo 9">
        <img src="10.jpg" alt="Photo 10">
        <img src="11.jpg" alt="Photo 11">
        <img src="12.jpg" alt="Photo 12">
        <img src="13.jpg" alt="Photo 13">
        <img src="14.jpg" alt="Photo 14">
        <img src="15.jpg" alt="Photo 15">
        <img src="16.jpg" alt="Photo 16">
        <img src="17.jpg" alt="Photo 17">
        <img src="18.jpg" alt="Photo 18">
        <img src="19.jpg" alt="Photo 19">
        <img src="20.jpg" alt="Photo 20">

</body>
</html>
