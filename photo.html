<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <title>My Fev Album</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* यहाँ मैले तपाईंको पुरानो CSS को साइजलाई असर नगर्ने गरी क्याप्सन मिलाएको छु */
        .album-photo { display: flex; flex-direction: column; align-items: center; }
        .caption-text { 
            margin-top: 5px; 
            font-size: 14px; 
            color: #333; 
            text-align: center; 
            width: 100%; 
        }
    </style>
</head>
<body>

    <h2 class="sub-title" style="text-align: center; font-size: 28px; margin-top: 20px;">My Fev Album</h2>
    <div class="straight-line album-line"></div>

    <div class="album-scroll-container">
        <div class="album-photo">
            <img src="1.png" alt="Photo 1">
            <p class="caption-text">किन:-</p>
        </div>
        </div>

    <div id="photo-counter">1 / 21</div>

    <script>
        const container = document.querySelector('.album-scroll-container');
        const counter = document.getElementById('photo-counter');

        container.addEventListener('scroll', () => {
            const scrollLeft = container.scrollLeft;
            // तपाईंको पुरानो logic अनुसार itemWidth निकाल्ने
            const itemWidth = container.querySelector('.album-photo').offsetWidth + 20;
            const index = Math.round(scrollLeft / itemWidth);
            counter.innerText = `${index + 1} / 21`;
        });
    </script>
</body>
</html>
