<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>अधिराज - मनको भावना</title>
    
    <style>
        /* १. नयाँ लोडिङ स्क्रिन - कालो ब्याकग्राउन्ड */
        #loadingScreen { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            background: #000000; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 9999; transition: 0.8s ease-in-out; 
        }
        
        .loader-text { 
            color: #ffffff; font-family: 'Georgia', serif; font-size: 22px; 
            letter-spacing: 2px; margin-bottom: 20px; font-weight: lighter;
        }

        /* रातो धर्को भरिने एनिमेसन */
        .progress-bar { width: 200px; height: 3px; background: #333; border-radius: 10px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: #d32f2f; animation: fillBar 2s forwards; }

        @keyframes fillBar {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* २. मुख्य डिजाइन */
        body { 
            background-color: #fcfbf7; font-family: 'Georgia', serif; margin: 0; 
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; 
            opacity: 0; transition: 1s; -webkit-user-select: none; user-select: none; 
        }
        body.visible { opacity: 1; }

        .header { margin-top: 60px; text-align: center; }
        .header h1 { color: #4a3728; font-size: 26px; font-weight: lighter; }

        /* ३. कार्डहरूको डिजाइन */
        .main-content { width: 90%; max-width: 400px; margin-top: 50px; display: flex; flex-direction: column; gap: 20px; }
        
        .diary-card { 
            background: white; padding: 35px 20px; border-radius: 15px; 
            text-decoration: none; display: block; border-left: 6px solid #d32f2f; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; transition: 0.3s; 
        }
        .diary-card:active { transform: scale(0.96); background: #f9f9f9; }
        
        .diary-card h2 { color: #2c3e50; font-size: 20px; margin: 0; font-weight: normal; }
        .diary-card p { color: #888; font-size: 13px; margin-top: 8px; font-style: italic; }
        
        .footer { margin-top: auto; padding: 40px; color: #bbb; font-size: 12px; letter-spacing: 1px; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="loadingScreen">
        <div class="loader-text">मनको भावना दस्ताबेज</div>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>

    <div class="header">
        <h1>अधिराज डायरी</h1>
    </div>

    <div class="main-content">
        <a href="anusthan.html" class="diary-card">
            <h2>169 अनुष्ठान</h2>
            <p>पढ्नको लागि ट्याप गर्नुहोस्</p>
        </a>

        <a href="adhura.html" class="diary-card">
            <h2>मेरा अधुरा शब्दहरू</h2>
            <p>पढ्नको लागि ट्याप गर्नुहोस्</p>
        </a>

        <a href="shayari.html" class="diary-card">
            <h2>तिम्रा लागि "सायरीहरू"</h2>
            <p>पढ्नको लागि ट्याप गर्नुहोस्</p>
        </a>
    </div>

    <div class="footer">२०२६ अधिराज | सुजना श्रेष्ठको लागि</div>

    <script>
        // लोडिङ स्क्रिन हटाउने लजिक
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loadingScreen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loadingScreen').style.display = 'none';
                    document.body.classList.add('visible');
                }, 800);
            }, 2200); // २.२ सेकेन्ड पछि खुल्ने
        });

        // सुरक्षा: कपी रोक्ने
        document.onkeydown = function(e) {
            if(e.ctrlKey && (e.keyCode === 67 || e.keyCode === 85 || e.keyCode === 83)) return false;
        };
    </script>
</body>
</html>
