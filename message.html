<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>अधिराजको डायरी</title>
    <link rel="icon" type="image/png" href="4870.png">
    
    <style>
        /* तपाईँको पुरानो सिस्टमको डिजाइन यहाँ छ */
        #loadingScreen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #fcfbf7; display: flex; justify-content: center; align-items: center; z-index: 9999; transition: 0.5s; }
        .loader { text-align: center; font-family: 'Georgia', serif; }
        .loader h2 { color: #d32f2f; letter-spacing: 2px; }
        .bar { width: 100px; height: 3px; background: #ddd; margin: 10px auto; position: relative; overflow: hidden; }
        .bar::after { content: ''; width: 50px; height: 3px; background: #d32f2f; position: absolute; left: -50px; animation: load 1.5s infinite; }
        @keyframes load { 100% { left: 100px; } }

        body { background-color: #fcfbf7; font-family: 'Georgia', serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; opacity: 0; transition: 1s; }
        body.visible { opacity: 1; }

        .header { margin-top: 50px; text-align: center; }
        .header img { width: 120px; height: 120px; border-radius: 50%; box-shadow: 0 5px 15px rgba(0,0,0,0.1); border: 3px solid #fff; }
        .header h1 { color: #4a3728; font-size: 24px; margin-top: 15px; }

        .main-content { width: 90%; max-width: 400px; margin-top: 40px; }
        .diary-card { background: white; padding: 30px 20px; border-radius: 20px; text-decoration: none; display: block; border-left: 8px solid #d32f2f; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        .diary-card h2 { color: #2c3e50; font-size: 19px; margin: 0; }
        .diary-card p { color: #d32f2f; font-weight: bold; font-size: 13px; margin-top: 10px; }
        .footer { margin-top: auto; padding: 30px; color: #999; font-size: 12px; }
    </style>
</head>
<body>

    <div id="loadingScreen">
        <div class="loader"><h2>अधिराज</h2><div class="bar"></div></div>
    </div>

    <div class="header">
        <img src="4870.png" alt="Logo">
        <h1>मनको भावना</h1>
    </div>

    <div class="main-content">
        <a href="message.html" class="diary-card">
            <h2>एक मौन अनुष्ठान: १६९ दिनको यात्रा</h2>
            <p>पढ्नको लागि यहाँ ट्याप गर्नुहोस्</p>
        </a>
    </div>

    <div class="footer">© २०२६ अधिराज | सुजना श्रेष्ठको लागि</div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loadingScreen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loadingScreen').style.display = 'none';
                    document.body.classList.add('visible');
                }, 500);
            }, 1500);
        });
    </script>
</body>
</html>
