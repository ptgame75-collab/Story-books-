<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>अनुष्ठान - अधिराज डायरी</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <style>
        :root { --bg: #fcfbf7; --text: #333; --card: #fff; --red: #d32f2f; }
        .dark-mode { --bg: #1a1a1a; --text: #f0f0f0; --card: #2d2d2d; --red: #ff5252; }

        body { background: var(--bg); color: var(--text); font-family: 'Georgia', serif; transition: 0.3s; margin: 0; padding: 15px; }

        .toolbar { 
            position: sticky; top: 0; display: flex; justify-content: space-between; 
            padding: 10px; background: var(--bg); z-index: 100; border-bottom: 1px solid #ddd;
        }
        .btn { padding: 8px 12px; cursor: pointer; border: 1px solid #ccc; border-radius: 5px; background: var(--card); color: var(--text); font-size: 14px; }

        .container { max-width: 600px; margin: 20px auto; }

        .main-title { text-align: center; color: var(--red); margin-bottom: 30px; }
        .main-title h1 { font-size: 28px; margin-bottom: 5px; }
        .main-title p { font-size: 16px; opacity: 0.8; font-style: italic; }

        .adhura-box {
            background: rgba(211, 47, 47, 0.03); 
            border: 1px solid rgba(211, 47, 47, 0.2); 
            padding: 25px; 
            border-radius: 15px; 
            margin-bottom: 40px; 
            font-style: italic;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            line-height: 1.8;
            font-size: 18px;
        }
        .adhura-box h3 { color: var(--red); text-align: center; margin-top: 0; font-size: 22px; border-bottom: 1px solid rgba(211, 47, 47, 0.1); padding-bottom: 10px; }

        .intro-text { 
            font-style: italic; line-height: 1.8; margin-bottom: 40px; padding: 25px; 
            background: rgba(211, 47, 47, 0.04); border-radius: 15px; font-size: 18px;
            border: 1px dashed var(--red);
        }

        .day-box { 
            background: var(--card); border-left: 5px solid var(--red); 
            padding: 20px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            border-radius: 4px; animation: fadeIn 0.8s ease;
        }

        .day-title { color: var(--red); font-weight: bold; font-size: 14px; margin-bottom: 8px; display: block; }
        .day-content { font-size: 18px; line-height: 1.7; margin: 0; }
        
        .footer { text-align: center; margin-top: 50px; padding: 40px 0; color: #888; font-size: 14px; border-top: 1px solid #eee; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="btn" onclick="history.back()">← गृहपृष्ठ</button>
        <div>
            <button class="btn" onclick="changeFont(1)">A+</button>
            <button class="btn" onclick="changeFont(-1)">A-</button>
            <button class="btn" onclick="toggleNight()">🌓 मोड</button>
        </div>
    </div>

    <div class="container">
        <div class="main-title">
            <h1>मनको भावना</h1>
            <p>एक मौन अनुष्ठान: १६९ दिनको यात्रा</p>
        </div>

        <div class="adhura-box">
