<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>भिडियो यादहरू</title>
    <style>
        body { 
            background: #fcfbf7; 
            font-family: 'Georgia', serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            -webkit-user-select: none; 
            user-select: none; 
        }

        .header { margin-top: 40px; text-align: center; width: 90%; max-width: 400px; position: relative; }
        .back-btn { 
            position: absolute; left: 10px; top: 5px;
            text-decoration: none; color: #4a3728; font-weight: bold; font-size: 16px;
        }
        .header h1 { color: #4a3728; font-size: 24px; margin: 0; font-weight: bold; }

        .main-content { width: 90%; max-width: 400px; margin-top: 30px; display: flex; flex-direction: column; gap: 25px; margin-bottom: 50px; }
        
        .video-card { 
            background: white; 
            padding: 20px 15px; 
            border-radius: 15px; 
            border-top: 5px solid #4a3728; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            text-align: center; 
        }
        .video-card h2 { color: #2c3e50; font-size: 18px; margin: 0 0 15px 0; }
        
        video { 
            width: 100%; 
            border-radius: 10px; 
            background: #000; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: block;
        }

        .footer { margin-top: auto; padding: 20px; color: #999; font-size: 12px; text-align: center; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="header">
        <a href="index.html" class="back-btn">← पछाडि</a>
        <h1>विशेष पलहरू</h1>
    </div>

    <div class="main-content">
        <div class="video-card">
            <h2>पहिलो भावना</h2>
            <video controls playsinline preload="auto">
                <source src="v1.mp4?fresh=true" type="video/mp4">
                तपाईंको ब्राउजरले यो भिडियो सपोर्ट गरेन।
            </video>
        </div>

        <div class="video-card">
            <h2>दोस्रो याद</h2>
            <video controls playsinline preload="metadata">
                <source src="v2.mp4" type="video/mp4">
                तपाईंको ब्राउजरले यो भिडियो सपोर्ट गरेन।
            </video>
        </div>

        <div class="video-card">
            <h2>तेस्रो शब्द</h2>
            <video controls playsinline preload="metadata">
                <source src="v3.mp4" type="video/mp4">
                तपाईंको ब्राउजरले यो भिडियो सपोर्ट गरेन।
            </video>
        </div>
    </div> 

    <div class="footer">2026 अधिराज</div>

</body>
</html>
